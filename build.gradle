import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext.kotlin_version = '2.4.10'

    repositories {
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

def printOutput(def output) {
    println "#educational_plugin_checker_version 1"
    def separator = System.lineSeparator()
    def lines = output.toString().split("(?<=${separator})|(?=${separator})")
    for (line in lines) {
        println "#educational_plugin" + line
    }
}

subprojects {
    apply plugin: 'application'
    apply plugin: 'java'
    apply plugin: 'kotlin'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // kotlin-stdlib is added automatically by the Kotlin Gradle plugin
        implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
        implementation 'junit:junit:4.13.2'
        testImplementation 'junit:junit:4.13.2'
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
        }
    }

    //noinspection GroovyAssignabilityCheck
    sourceSets {
        main {
            kotlin.srcDir 'src'
            java.srcDir 'src'
            resources.srcDir 'src'
        }

        test {
            kotlin.srcDir 'test'
            java.srcDir 'test'
        }
    }

    application {
        if (project.hasProperty("mainClass")) {
            mainClass = project.getProperty("mainClass")
        }
    }
    test {
        outputs.upToDateWhen { false }
        addTestListener(new TestListener() {
            void beforeSuite(TestDescriptor suite) {}
            void afterSuite(TestDescriptor suite, TestResult result) {}
            void beforeTest(TestDescriptor testDescriptor) {}
            void afterTest(TestDescriptor testDescriptor, TestResult result) {
                if (result.resultType == TestResult.ResultType.FAILURE) {
                    def message = result.exception?.message ?: "Wrong answer"
                    def lines = message.readLines()
                    println "#educational_plugin FAILED + " + lines[0]
                    lines.subList(1, lines.size()).forEach { line ->
                        println "#educational_plugin" + line
                    }
                    // we need this to separate output of different tests
                    println()
                }
            }
        })
    }

    if (project.hasProperty("educationalRun") && "true".equalsIgnoreCase(project.getProperty("educationalRun"))) {
        def runOutput = new ByteArrayOutputStream()
        tasks.run.setStandardOutput(runOutput)
        tasks.run.doLast { printOutput(runOutput) }
    }
}

project(':testutil') {
    dependencies {
        implementation 'junit:junit:4.13.2'
    }
}

configure(subprojects.findAll { it.name != 'testutil' }) {
    dependencies {
        testImplementation project(':testutil')
    }
}
